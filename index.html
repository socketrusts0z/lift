<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173d2c"><meta name="description" content="Your training, on your terms. An offline workout tracker with on-device storage and portable backups."><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css?v=16"><title>Lift — Your training, on your terms</title></head><body>
<div class="app-shell"><aside class="sidebar"><a class="wordmark" href="#train" aria-label="Lift home"><span class="brand-icon">L</span>lift<span class="brand-period">.</span></a><p class="sidebar-tagline">YOUR TRAINING.<br>ON YOUR TERMS.</p><nav id="desktop-nav" aria-label="Main navigation"></nav><div class="sidebar-bottom"><span class="device-icon">◈</span><strong>Made for your device.</strong><p>No account. No cloud.<br>Just you and your progress.</p><span class="version">LIFT / 1.0</span></div></aside>
<div class="main-shell"><header class="topbar"><a href="#train" class="mobile-logo">lift.</a><div class="topbar-context">A little stronger, every session.</div><div class="save-status" id="save-status" role="status">Opening local storage…</div></header><div id="error-banner" class="error-banner" role="alert" hidden></div><main id="main" tabindex="-1"><div class="loading">Opening your training log…</div></main><footer class="page-footer"><span>YOUR DATA STAYS WITH YOU</span><span id="connection">On-device storage</span></footer></div>
</div><nav id="mobile-nav" class="mobile-nav" aria-label="Mobile navigation"></nav>
<dialog id="modal" aria-labelledby="modal-title">
  <div class="dialog-top">
    <h2 id="modal-title"></h2>
    <button type="button" class="icon-button" id="modal-close" aria-label="Close dialog">×</button>
  </div>
  <div id="modal-content"></div>
</dialog>
<div id="rest-bar" class="rest-bar row" role="group" aria-label="Rest timer">
  <div class="rest-readout">
    <span class="eyebrow muted">Rest</span>
    <strong id="rest-time" role="timer"></strong>
  </div>
  <div class="actions">
    <button class="ghost" data-action="rest-add" data-preserve-scroll>+30 sec</button>
    <button class="secondary" data-action="rest-skip" data-preserve-scroll>Skip</button>
  </div>
</div>
<div id="toast" class="toast" aria-hidden="true">
  <span id="toast-check" class="toast-check" hidden>✓</span>
  <span id="toast-message"></span>
</div>
<div id="toast-status" class="sr-only" role="status" aria-atomic="true"></div>
<noscript>Lift needs JavaScript to store and display your workouts on this device.</noscript><script type="module" src="./app.mjs?v=16"></script></body></html>
